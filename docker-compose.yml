services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    shm_size: "256mb"
    extra_hosts:
      - "localhost:127.0.0.1"
    ports:
      - "5173:5173"
    environment:
      DOCKER: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      SIMPLE_GIT_HOOKS: "0"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler
      - ./.dev.vars:/app/.dev.vars:ro
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "5173"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./Dockerfile
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules/
            - .git/
            - .wrangler/
            - dist/
            - .dev.vars
            - TODO
            - coverage/
            - playwright-report/
            - test-results/

volumes:
  node_modules:
  wrangler_state:
