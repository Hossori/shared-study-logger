# 本番 D1 マイグレーション（手動承認）
#
# Worker を以前のバージョンへロールバックしても、D1 に適用済みのスキーマ変更は
# 戻らない。自動デプロイ（ci.yml の deploy）に混ぜると、Worker だけ戻して
# DB は進んだまま、という不整合が起きうる。
# そのためリモート D1 への apply は本ワークフローに分離する。
#
# 運用:
# 1. GitHub Settings → Environments に `d1-migrations` を作り、
#    Required reviewers を有効にする（承認なしでは apply しない）。
# 2. リポジトリ Secrets に CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を登録する。
#    トークンには D1 Edit が必要（Workers Scripts: Edit だけでは不足しうる）。
# 3. Actions → 「D1 migrations (production)」→ main ブランチを選んで Run workflow。

name: D1 migrations (production)

on:
  workflow_dispatch:

concurrency:
  group: d1-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: d1-migrations
    permissions:
      contents: read
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::このワークフローは main ブランチからのみ実行してください（現在: ${GITHUB_REF}）。"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List remote D1 migrations
        run: pnpm exec wrangler d1 migrations list shared-study-logger-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply shared-study-logger-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
